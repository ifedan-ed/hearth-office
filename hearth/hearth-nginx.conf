#
# Hearth's addition to the engine's nginx (http level, /etc/nginx/conf.d):
# serve the brotli copies precompress.sh made at image build to browsers
# that take brotli. Only static files have copies; answers from the
# document service and files without a copy are sent as they are.
brotli_static on;
