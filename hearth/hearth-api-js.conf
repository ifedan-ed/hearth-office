#
# api.js, cacheable on a later open (Hearth's docs/office-speed-capacity.md).
# Installed as /etc/nginx/hearth/api-js.conf and included by the image's
# ds-docservice.conf in place of upstream's one api.js location (the
# Dockerfile does both, failing the build if upstream's lines move), so
# these locations come before the catch-all for static files there.
# @VERSION@ is the engine's version, filled in by the Dockerfile from that
# same file; $cache_tag is the tag ds-cache.conf sets at every start.
#
# Upstream sends api.js no-store under every address, and its WOPI page
# asks for it with the file in the query (a shard key for load
# balancers), so every open fetched it again: one round trip, 0.15 to
# 0.3 s on a mobile line. Here the WOPI page asks for the versioned
# address and that one is cached for good: its content is fixed by the
# tag (api.js is the template, which the tag hashes, with the tag
# written in).

# The WOPI page: the document service writes upstream's unversioned
# address; nginx puts the current tag in (the one source of the tag, read
# per request, so a page never names a tag the engine has moved past).
# The document service sends the page uncompressed (it has no
# compression), which sub_filter needs; were that to change, the page
# would keep the unversioned address and the open would cost the round
# trip again, nothing worse. Proxy settings as ds-docservice.conf's
# "location /", which this prefix would otherwise reach.
location ^~ /hosting/wopi/ {
  proxy_pass http://docservice;
  proxy_http_version 1.1;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_connect_timeout 300s;
  proxy_redirect off;
  sub_filter 'src="../../../web-apps/apps/api/documents/api.js"' 'src="../../../@VERSION@-$cache_tag/web-apps/apps/api/documents/api.js"';
  sub_filter_once on;
}

# The versioned address. Cached for good only under the current tag. Any
# other tag is refused, never answered with the current file: a browser
# would keep that file under the wrong name for a year, and the loader,
# seeing a tag in its own address that is not the one written in it, would
# put a second tag into every address it makes.
location ~ ^/(?<hearth_api_prefix>[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)/web-apps/apps/api/documents/api\.js$ {
  if ($hearth_api_prefix != "@VERSION@-$cache_tag") {
    add_header Cache-Control "no-store" always;
    return 404;
  }
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  alias /var/www/euro-office/documentserver/web-apps/apps/api/documents/api.js;
}

# The unversioned address (what other hosts and upstream's own pages
# load): no-store, as upstream.
location = /web-apps/apps/api/documents/api.js {
  expires off;
  add_header Cache-Control "no-store, no-cache, must-revalidate";
  alias /var/www/euro-office/documentserver/web-apps/apps/api/documents/api.js;
}
